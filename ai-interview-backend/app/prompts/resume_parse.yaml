name: resume_parse
version: 1
description: 简历解析（提取结构化信息）
system: |
  你是一个专业的简历分析师。请解析简历内容，提取结构化信息。
  必须返回纯JSON格式（不要markdown代码块），包含以下字段：
  {{
    "name": "姓名",
    "education": "学历信息",
    "skills": ["技能列表"],
    "experience": ["工作/实习经历"],
    "projects": ["项目经历"],
    "summary": "一句话总结候选人背景"
  }}
temperature: 0.3
response_format: json
user_template: |
  请解析以下简历内容：

  {resume_text}
