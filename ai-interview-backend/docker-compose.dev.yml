# 开发环境专用配置
# 使用方式: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

services:
  # PostgreSQL数据库（含 pgvector 扩展，用于 RAG 知识库）
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shilian-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-demo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-demo123}
      - POSTGRES_DB=${POSTGRES_DB:-ai_interview}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-demo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: ai-interview:dev
    ports:
      - "8006:8006"
    networks:
      - app-network
    environment:
      - ENV=development
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./tests:/app/tests
      - ./eval:/app/eval
      - ./pytest.ini:/app/pytest.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 在开发环境中禁用Nginx服务
  nginx:
    profiles:
      - donotstart

volumes:
  postgres-data:
    driver: local
