# 单机 2GB ECS 精简部署：postgres(pgvector) + redis + app(含celery) + nginx
services:
  app:
    build: .
    container_name: shilian-app
    restart: unless-stopped
    env_file: [.env]
    environment:
      - ENV=production
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    mem_limit: 1200m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${API_PORT:-8001}/api/v1/config/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks: [app-network]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  postgres:
    image: pgvector/pgvector:pg16
    container_name: shilian-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 400m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [app-network]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  redis:
    image: redis:7-alpine
    container_name: shilian-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    mem_limit: 160m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [app-network]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  nginx:
    image: nginx:alpine
    container_name: shilian-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"   # 待域名 + 证书后开启
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../ai-interview-frontend/dist:/usr/share/nginx/html/user:ro
      - ../ai-interview-admin/dist:/usr/share/nginx/html/admin:ro
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on: [app]
    mem_limit: 64m
    networks: [app-network]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  postgres-data:
  redis-data:

networks:
  app-network:
    driver: bridge
