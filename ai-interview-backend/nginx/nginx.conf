# 试炼 (MockPilot) - Production Nginx Configuration
# TLS termination + API reverse proxy + frontend static serving

# Rate limiting zone for login endpoints
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# Upstream: FastAPI backend
upstream backend {
    server app:8001;
}

server {
    listen 80;
    server_name _;

    # Redirect HTTP to HTTPS (disable if no TLS)
    # return 301 https://$host$request_uri;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client max body size (resume upload)
    client_max_body_size 20M;

    # Health check endpoint (no auth required)
    location /api/v1/config/health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support (streaming interview responses)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # Swagger docs
    location /client/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }
    location /backoffice/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }
    location /api-docs/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Uploaded files (avatars, resumes)
    location /uploads/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # User-facing frontend
    location / {
        root /usr/share/nginx/html/user;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Admin panel
    location /admin {
        alias /usr/share/nginx/html/admin;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }
}

